<svg xmlns="http://www.w3.org/2000/svg" width="340" height="420" viewBox="0 0 340 420" role="img" aria-labelledby="title">
<title id="title">Esempio illustrato: controllare il pagamento prima della conferma</title>
<rect width="340" height="420" rx="16" fill="#eaf1ff"/><rect x="38" y="12" width="264" height="396" rx="24" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="58" y="43" font-family="Arial,sans-serif" font-size="12" fill="#64748b">ESEMPIO ILLUSTRATO</text>
<text x="60" y="79" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172554">Riepilogo acquisto</text>
<rect x="58" y="100" width="224" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="73" y="128" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">Piano scelto</text><text x="73" y="154" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Controlla prezzo e durata</text><text x="73" y="181" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">Controlla il rinnovo</text><text x="73" y="209" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">Metodo di pagamento</text><text x="73" y="235" font-family="Arial,sans-serif" font-size="14" fill="#1e293b">Carta selezionata</text>
<rect x="69" y="282" width="202" height="47" rx="23" fill="#2563eb"/><text x="121" y="311" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Conferma</text>
<text x="67" y="365" font-family="Arial,sans-serif" font-size="13" fill="#334155">Conferma solo se sei d'accordo</text>
</svg>
